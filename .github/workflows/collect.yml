name: Collect HHN wait times

on:
  schedule:
    # Run every 5 minutes, offset from the top of the hour.
    # GitHub recommends avoiding the start of the hour because
    # scheduled workflows are more likely to be delayed then.
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hhn-wait-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check HHN date and time
        id: hhn_hours
        run: |
          NOW=$(TZ=America/New_York date '+%Y-%m-%d %H:%M')
          DATE=$(TZ=America/New_York date '+%Y-%m-%d')
          HOUR=$(TZ=America/New_York date '+%H')

          echo "Eastern Time: $NOW"

          START_DATE="2026-08-29"
          END_DATE="2026-11-01"

          if [[ "$DATE" < "$START_DATE" || "$DATE" > "$END_DATE" ]]; then
            echo "HHN season is not active."
            echo "collect=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HHN collection window:
          # 2:00 PM through 2:55 AM.
          # The 3:00 AM run is intentionally excluded.
          if [[ "$HOUR" -ge 14 || "$HOUR" -lt 3 ]]; then
            echo "HHN is within collection hours."
            echo "collect=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside HHN collection hours."
            echo "collect=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.hhn_hours.outputs.collect == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.hhn_hours.outputs.collect == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.hhn_hours.outputs.collect == 'true'
        run: pip install -r collector_requirements.txt

      - name: Collect wait times
        if: steps.hhn_hours.outputs.collect == 'true'
        run: python collector.py

      - name: Save data
        if: steps.hhn_hours.outputs.collect == 'true'
        run: |
          git config user.name "HHN Wait Tracker"
          git config user.email "actions@github.com"

          git add data/waits.csv

          if git diff --cached --quiet; then
            echo "No new data changes to commit."
            exit 0
          fi

          git commit -m "Update HHN wait times"
          git push
